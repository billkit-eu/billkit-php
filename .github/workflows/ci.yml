name: CI

# Unit tests only. The integration suite is gated on
# BILLKIT_INTEGRATION_BASE_URL and skips itself here: it needs a live BillKit
# API, which is exercised in the private platform repo before a release is cut.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        include:
          # One leg measures coverage; the rest stay fast.
          - php: '8.4'
            coverage: pcov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: ${{ matrix.coverage || 'none' }}
          tools: composer:v2
      - name: Install
        run: composer install --no-interaction --no-progress
      - name: PHPStan
        run: composer analyse
      - name: Code style
        run: composer cs:check
      - name: Test
        if: ${{ !matrix.coverage }}
        run: composer test
      - name: Test with coverage
        if: ${{ matrix.coverage }}
        run: vendor/bin/phpunit --coverage-text
